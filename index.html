<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>李龍龍の手帳本</title>
  
  <meta name="description" content="李龍龍準備轉生到異世界">
  <meta property="og:title" content="李龍龍の手帳本">
  <meta property="og:description" content="李龍龍準備轉生到異世界">
  <meta property="og:image" content="web.png"> 
  <meta property="og:type" content="website">

  <link rel="icon" href="web.png" type="image/png">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-overlay: rgba(248, 246, 240, 0.9);
      --card-bg: rgba(255, 255, 255, 0.95); 
      --text-main: #5C544D; 
      --text-light: #8E8781; 
      --accent-color: #E2D3C1; 
      --accent-dark: #C9B8A3;
      --danger-color: #DDA7A5; 
      --today-color: #D6C2A9;
      --color-1: #E2D3C1; --color-2: #D4E2D9; --color-3: #D6E0E9; --color-4: #E9D7D7; --color-5: #EFE5D3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }

    body {
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #F8F6F0;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden; 
    }

    .page-overlay { background-color: var(--bg-overlay); min-height: 100vh; width: 100%; padding-bottom: 60px; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; position: relative; }

    .logo-container { text-align: center; padding-top: 25px; margin-bottom: clamp(40px, 15vw, 100px); }
    .main-logo { width: 85%; max-width: 400px; height: auto; }

    /* 區塊樣式 */
    .header-section, .calendar-section, .form-section, .record-card, .gallery-section {
      background: var(--card-bg) !important;
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      padding: 20px;
    }

    .header-section { text-align: center; position: relative; } 
    .congrats-img { position: absolute; top: -50px; right: -30px; max-width: 140px; height: auto; z-index: 10; filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.15)); transform: rotate(8deg); }
    .music-img { position: absolute; top: -45px; left: -30px; max-width: 110px; height: auto; z-index: 10; filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.15)); transform: rotate(-10deg); }

    .countdown-display { font-size: 2.8rem; font-weight: bold; }
    .countdown-display span { font-size: 1.1rem; color: var(--text-light); }

    /* 日曆週橫幅 */
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-week-banner { grid-column: span 7; background-color: rgba(214, 194, 169, 0.25); color: var(--text-main); font-size: 0.85rem; font-weight: bold; text-align: center; padding: 5px 0; border-radius: 6px; margin-top: 8px; margin-bottom: 2px; }

    .calendar-day { min-height: 85px; border: 1px solid rgba(226, 211, 193, 0.2); border-radius: 8px; padding: 5px 2px; cursor: pointer; display: flex; flex-direction: column; }
    .calendar-day-num { font-size: 0.85rem; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .calendar-day.today .calendar-day-num { background: var(--today-color); color: #fff; border-radius: 50%; }
    .calendar-day.selected { border: 2px solid var(--accent-dark); background: rgba(252, 250, 247, 1); }
    .event-bar { font-size: 10px; padding: 3px 5px; border-radius: 5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4A443F; border-left: 3px solid rgba(0,0,0,0.1); }

    /* 圖庫專區 (跑馬燈) - 修改為 4:3 比例 */
    .gallery-carousel { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scroll-snap-type: x mandatory; }
    .photo-card { position: relative; flex: 0 0 200px; height: 150px; border-radius: 12px; overflow: hidden; scroll-snap-align: start; background: #eee; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; }
    .week-pill { position: absolute; top: 8px; left: 8px; background: var(--accent-color); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 3px 10px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .delete-photo { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }

    /* 表單樣式 */
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #EAE6DF; border-radius: 10px; font-size: 1rem; outline: none; }
    .btn-quick { padding: 4px 12px; background: #fff; border: 1.5px solid var(--accent-color); border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    .btn-submit { width: 100%; padding: 15px; background: var(--accent-color); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* 彈窗 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92, 84, 77, 0.4); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; animation: modalPop 0.3s ease-out; }
    @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* 統計列表清單 */
    .records-scroll-container { max-height: 480px; overflow-y: auto; }
    .record-card { padding: 15px; border-left: 8px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
    .action-group { display: flex; gap: 10px; }
    .edit-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--accent-dark); }
  </style>
</head>
<body>

  <div class="page-overlay">
    <div class="container">
      
      <div class="logo-container">
        <img src="logo.png" alt="Logo" class="main-logo" onerror="this.style.display='none'">
      </div>

      <header class="header-section">
        <img src="congrats.png" alt="Congrats" class="congrats-img" onerror="this.style.display='none'">
        <h1 style="font-size:0.9rem; color:var(--text-light); margin-bottom:5px; font-weight:normal;">距離李龍龍(暫)降臨</h1>
        <div class="countdown-display" id="countdown-timer">0<span>天</span></div>
      </header>

      <section class="calendar-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
          <button onclick="changeMonth(-1)" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">❮</button>
          <h2 id="calendar-title" style="font-size:1.1rem;"></h2>
          <button onclick="changeMonth(1)" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">❯</button>
        </div>
        <div class="calendar-weekdays" style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:0.75rem; color:var(--text-light); margin-bottom:10px;">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendar-days" class="calendar-days"></div>
      </section>

      <section class="gallery-section">
        <h3 style="font-size:1rem; margin-bottom:15px;">李龍龍即時觀測</h3>
        <div id="gallery-carousel" class="gallery-carousel">
          </div>
        <div style="margin-top:15px; border-top:1px dashed #E2D3C1; padding-top:15px;">
          <div style="display:flex; gap:10px;">
            <select id="upload-week" class="form-control" style="width:100px;">
              <option value="W1">W1</option><option value="W2">W2</option><option value="W3">W3</option><option value="W4">W4</option><option value="W5">W5</option>
              <option value="W6" selected>W6</option><option value="W7">W7</option><option value="W8">W8</option><option value="W9">W9</option><option value="W10">W10</option>
              <option value="W11">W11</option><option value="W12">W12</option><option value="W13">W13</option><option value="W14">W14</option><option value="W15">W15</option>
              <option value="W20">W20</option><option value="W30">W30</option><option value="W38">W38</option>
            </select>
            <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="handlePhotoUpload(this)">
            <button class="btn-submit" style="margin:0; flex:1; padding:10px;" onclick="document.getElementById('photo-input').click()">上傳照片 (1MB內)</button>
          </div>
        </div>
      </section>

      <section class="form-section" id="form-area">
        <img src="music.png" alt="Music" class="music-img" onerror="this.style.display='none'">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
          <span style="font-weight:bold;">新增紀錄</span>
          <input type="date" id="input-date" class="form-control" style="width:auto; padding:5px;" onchange="highlightSelectedDate()">
        </div>
        
        <div class="input-group">
          <label>標籤色</label>
          <div id="form-color-picker" style="display:flex; gap:12px;">
            <div class="color-opt active" style="background:var(--color-1); width:28px; height:28px; border-radius:50%;" data-color="var(--color-1)"></div>
            <div class="color-opt" style="background:var(--color-2); width:28px; height:28px; border-radius:50%;" data-color="var(--color-2)"></div>
            <div class="color-opt" style="background:var(--color-3); width:28px; height:28px; border-radius:50%;" data-color="var(--color-3)"></div>
            <div class="color-opt" style="background:var(--color-4); width:28px; height:28px; border-radius:50%;" data-color="var(--color-4)"></div>
            <div class="color-opt" style="background:var(--color-5); width:28px; height:28px; border-radius:50%;" data-color="var(--color-5)"></div>
          </div>
        </div>

        <div class="input-group">
          <label>今日行程</label>
          <input type="text" id="input-content" class="form-control" placeholder="輸入內容">
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-quick" onclick="quickFill('產檢', 'var(--color-2)')">＋ 產檢</button>
            <button class="btn-quick" onclick="quickFill('媽媽教室', 'var(--color-5)')">＋ 媽媽教室</button>
          </div>
        </div>

        <div class="input-group">
          <label>費用</label>
          <input type="number" id="input-cost" class="form-control" placeholder="$" min="0">
        </div>
        <div class="input-group">
          <label>Murmur... (只能唸 30 字)</label>
          <textarea id="input-note" class="form-control" maxlength="30" rows="2"></textarea>
        </div>
        <button class="btn-submit" onclick="saveRecord()">上傳紀錄</button>
      </section>

      <h2 style="text-align:center; font-size:1.1rem; margin:20px 0;">將將將！這裡會統計一切！</h2>
      <div id="records-container" class="records-scroll-container"></div>
      
      <div class="total-summary-container" style="text-align:center; margin-top:20px;">
        <button id="toggle-total-btn" class="toggle-total-btn" style="background:var(--accent-color); color:white; border:none; padding:10px 25px; border-radius:25px; cursor:pointer;" onclick="toggleTotalSection()">＼按我／</button>
        <div id="total-summary-row" style="display:none; background:#5C544D; color:#FFF; padding:20px; border-radius:16px; margin-top:15px; justify-content:space-between; align-items:center;">
          <span>費用總計</span>
          <span style="font-size:1.5rem; font-weight:bold;">NT$ <span id="grand-total-amount">0</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3>編輯資料</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:1.5rem;">×</button>
      </div>
      <div class="input-group">
        <label>標籤色</label>
        <div id="modal-color-picker" style="display:flex; gap:10px;">
          <div class="color-opt" style="background:var(--color-1); width:25px; height:25px; border-radius:50%;" data-color="var(--color-1)"></div>
          <div class="color-opt" style="background:var(--color-2); width:25px; height:25px; border-radius:50%;" data-color="var(--color-2)"></div>
          <div class="color-opt" style="background:var(--color-3); width:25px; height:25px; border-radius:50%;" data-color="var(--color-3)"></div>
          <div class="color-opt" style="background:var(--color-4); width:25px; height:25px; border-radius:50%;" data-color="var(--color-4)"></div>
          <div class="color-opt" style="background:var(--color-5); width:25px; height:25px; border-radius:50%;" data-color="var(--color-5)"></div>
        </div>
      </div>
      <div class="input-group"><label>今日行程</label><input type="text" id="modal-content" class="form-control"></div>
      <div class="input-group"><label>費用</label><input type="number" id="modal-cost" class="form-control" min="0"></div>
      <div class="input-group"><label>Murmur...</label><textarea id="modal-note" class="form-control" maxlength="30"></textarea></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn-submit" onclick="updateFromModal()">儲存</button>
        <button class="btn-submit" style="background:var(--danger-color);" onclick="deleteFromModal()">刪除</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyCOIXXR5d87zUf1o072xg-lPWsrFqVXH98",
      authDomain: "dragonlee-9f43c.firebaseapp.com",
      databaseURL: "https://dragonlee-9f43c-default-rtdb.firebaseio.com",
      projectId: "dragonlee-9f43c",
      storageBucket: "dragonlee-9f43c.firebasestorage.app",
      messagingSenderId: "407832542671",
      appId: "1:407832542671:web:89ba134f62ed144e9f66ba"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('longlong_records_v2');
    const galleryRef = db.ref('longlong_gallery');

    const dueYear = 2026; const dueMonth = 11; const dueDateNum = 14;
    let records = []; 
    let currentYear = new Date().getFullYear(); 
    let currentMonth = new Date().getMonth();
    let selectedFormColor = "var(--color-1)"; 
    let selectedModalColor = "var(--color-1)"; 
    let editingId = null;

    function init() {
      const now = new Date();
      document.getElementById('input-date').value = now.toISOString().split('T')[0];
      
      // 計算倒數
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetDate = new Date(dueYear, dueMonth, dueDateNum);
      const diffDays = Math.ceil((targetDate - todayDate) / (1000 * 60 * 60 * 24));
      startCounterAnimation('countdown-timer', diffDays);
      setupColorPickers();

      // Firebase 紀錄監聽
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        records = data ? Object.values(data) : [];
        renderCalendar(); 
        renderRecords();
      });

      // Firebase 圖庫監聽
      galleryRef.on('value', (snapshot) => {
        const photos = snapshot.val();
        renderGallery(photos);
      });
    }

    // 限制日曆切換 (2026/12 封頂)
    function changeMonth(n) {
      let tempMonth = currentMonth + n;
      let tempYear = currentYear;
      if (tempMonth < 0) { tempMonth = 11; tempYear--; }
      else if (tempMonth > 11) { tempMonth = 0; tempYear++; }

      // 檢查是否超過 2026/12
      if (tempYear > 2026) return;
      if (tempYear === 2026 && tempMonth > 11) return;

      currentMonth = tempMonth;
      currentYear = tempYear;
      renderCalendar();
    }

    // 超音波圖庫處理
    function handlePhotoUpload(input) {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 1024 * 1024) {
        input.value = ""; // 清空輸入框
        return alert("檔案太大囉！請限制在 1MB 以內。");
      }

      const week = document.getElementById('upload-week').value;
      const reader = new FileReader();
      reader.onload = function(e) {
        const photoData = {
          id: Date.now(),
          week: week,
          src: e.target.result
        };
        // 寫入 Firebase 後觸發成功訊息
        galleryRef.child(photoData.id).set(photoData).then(() => {
          alert("上傳成功！");
          input.value = ""; // 清空上傳欄位，方便下次上傳
        }).catch((error) => {
          alert("上傳失敗：" + error.message);
        });
      };
      reader.readAsDataURL(file);
    }

    function renderGallery(photos) {
      const container = document.getElementById('gallery-carousel');
      container.innerHTML = '';
      if (!photos) return;
      Object.values(photos).sort((a,b) => a.id - b.id).forEach(p => {
        container.innerHTML += `
          <div class="photo-card">
            <div class="week-pill">${p.week}</div>
            <button class="delete-photo" onclick="deletePhoto(${p.id})">×</button>
            <img src="${p.src}" alt="Baby Ultrasound">
          </div>
        `;
      });
    }

    function deletePhoto(id) {
      if(confirm("要刪除這張照片嗎？")) galleryRef.child(id).remove();
    }

    // 日曆渲染
    function renderCalendar() {
      const container = document.getElementById('calendar-days');
      const inputDate = document.getElementById('input-date').value;
      document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth + 1}月`;
      container.innerHTML = '';
      
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const totalWeeks = Math.ceil((firstDay + daysInMonth) / 7);

      for (let week = 0; week < totalWeeks; week++) {
        const sundayDate = new Date(currentYear, currentMonth, 1 - firstDay + (week * 7));
        const anchorDate = new Date(2026, 2, 15);
        sundayDate.setHours(0,0,0,0); anchorDate.setHours(0,0,0,0);
        const diffDays = Math.round((sundayDate - anchorDate) / (1000 * 60 * 60 * 24));
        const weekNum = Math.floor(diffDays / 7) + 1;

        if (weekNum > 0) {
          const wBanner = document.createElement('div');
          wBanner.className = 'calendar-week-banner';
          wBanner.innerText = `W${weekNum}`;
          container.appendChild(wBanner);
        }

        for (let i = 0; i < 7; i++) {
          const dayOffset = week * 7 + i;
          const dateNum = dayOffset - firstDay + 1;
          if (dateNum <= 0 || dateNum > daysInMonth) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'calendar-day empty';
            emptyDiv.style.visibility = 'hidden';
            container.appendChild(emptyDiv);
          } else {
            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
            const div = document.createElement('div');
            div.className = `calendar-day ${dateStr === inputDate ? 'selected' : ''}`;
            if(new Date().toDateString() === new Date(currentYear, currentMonth, dateNum).toDateString()) div.classList.add('today');
            div.innerHTML = `<div class="calendar-day-num">${dateNum}</div>`;
            records.filter(r => r.date === dateStr).forEach(r => {
              const bar = document.createElement('div');
              bar.className = 'event-bar'; bar.style.backgroundColor = r.color; bar.innerText = r.content;
              bar.onclick = (e) => { e.stopPropagation(); openEditModal(r.id); };
              div.appendChild(bar);
            });
            div.onclick = () => { document.getElementById('input-date').value = dateStr; renderCalendar(); };
            container.appendChild(div);
          }
        }
      }
    }

    // 紀錄清單渲染
    function renderRecords() {
      const container = document.getElementById('records-container');
      container.innerHTML = '';
      records.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(r => {
        container.innerHTML += `
          <div class="record-card" style="border-left-color:${r.color};">
            <div style="flex:1;">
              <small>${r.date}</small><br>
              <b style="font-size:1.05rem;">${r.content}</b><br>
              ${r.note ? `<span class="note-text" style="font-size:0.85rem; color:var(--text-light); italic; background:#FDFBF8; padding:2px 5px; border-radius:5px;">${r.note}</span>` : ''}
            </div>
            <div style="text-align:right;">
              <div style="color:var(--danger-color); font-weight:bold; margin-bottom:5px;">$${(r.cost || 0).toLocaleString()}</div>
              <button class="edit-btn" onclick="openEditModal(${r.id})">✎</button>
            </div>
          </div>`;
      });
      updateTotalDisplay();
    }

    // 通用功能
    function setupColorPickers() {
      document.querySelectorAll('#form-color-picker .color-opt').forEach(opt => {
        opt.onclick = () => { document.querySelectorAll('#form-color-picker .color-opt').forEach(o => o.style.border="none"); opt.style.border="2px solid var(--text-main)"; selectedFormColor = opt.getAttribute('data-color'); };
      });
      document.querySelectorAll('#modal-color-picker .color-opt').forEach(opt => {
        opt.onclick = () => { document.querySelectorAll('#modal-color-picker .color-opt').forEach(o => o.style.border="none"); opt.style.border="2px solid var(--text-main)"; selectedModalColor = opt.getAttribute('data-color'); };
      });
    }

    function openEditModal(id) {
      const r = records.find(item => item.id === id);
      if(!r) return;
      editingId = id;
      document.getElementById('modal-content').value = r.content;
      document.getElementById('modal-cost').value = r.cost || "";
      document.getElementById('modal-note').value = r.note || "";
      selectedModalColor = r.color;
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

    function updateFromModal() {
      const idx = records.findIndex(r => r.id === editingId);
      records[idx].content = document.getElementById('modal-content').value.trim();
      records[idx].cost = Math.max(0, parseInt(document.getElementById('modal-cost').value) || 0);
      records[idx].note = document.getElementById('modal-note').value.trim();
      records[idx].color = selectedModalColor;
      dbRef.set(records); closeModal();
    }

    function deleteFromModal() {
      if(confirm("確定要刪除嗎？")) { records = records.filter(r => r.id !== editingId); dbRef.set(records); closeModal(); }
    }

    function saveRecord() {
      const content = document.getElementById('input-content').value.trim();
      const cost = Math.max(0, parseInt(document.getElementById('input-cost').value) || 0);
      const note = document.getElementById('input-note').value.trim();
      const date = document.getElementById('input-date').value;
      if(!content) return alert("請輸入內容");
      records.push({ id: Date.now(), date, content, cost, note, color: selectedFormColor });
      dbRef.set(records);
      document.getElementById('input-content').value = ""; document.getElementById('input-cost').value = ""; document.getElementById('input-note').value = "";
    }

    function updateTotalDisplay() {
      if(document.getElementById('total-summary-row').style.display === 'flex') {
        const total = records.reduce((sum, r) => sum + (r.cost || 0), 0);
        document.getElementById('grand-total-amount').innerText = total.toLocaleString();
      }
    }

    function toggleTotalSection() {
      const row = document.getElementById('total-summary-row');
      const btn = document.getElementById('toggle-total-btn');
      if (row.style.display === 'flex') { row.style.display = 'none'; btn.innerText = '＼按我／'; }
      else { row.style.display = 'flex'; btn.innerText = '\\ 趕快收起來 /'; updateTotalDisplay(); }
    }

    function quickFill(t, c) { document.getElementById('input-content').value = t; selectedFormColor = c; }
    function startCounterAnimation(id, target) {
      const el = document.getElementById(id); let startTime = null;
      const step = (ts) => {
        if (!startTime) startTime = ts; const progress = Math.min((ts - startTime) / 1500, 1);
        const current = Math.floor(progress * target);
        el.innerHTML = id === 'countdown-timer' ? `${current}<span>天</span>` : current.toLocaleString();
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    function highlightSelectedDate() { const v = new Date(document.getElementById('input-date').value); currentYear=v.getFullYear(); currentMonth=v.getMonth(); renderCalendar(); }

    init();
  </script>
</body>
</html>
