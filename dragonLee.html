<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>李龍龍行事曆</title>
  <style>
    :root {
      --bg-overlay: rgba(248, 246, 240, 0.88);
      --card-bg: rgba(255, 255, 255, 0.92); 
      --text-main: #5C544D; 
      --text-light: #8E8781; 
      --accent-color: #E2D3C1; 
      --accent-dark: #C9B8A3;
      --danger-color: #DDA7A5; 
      --today-color: #D6C2A9;
      --edit-color: #B8C4D9;
      
      --color-1: #E2D3C1; --color-2: #D4E2D9; --color-3: #D6E0E9; --color-4: #E9D7D7; --color-5: #EFE5D3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }

    body {
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #F8F6F0;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page-overlay { background-color: var(--bg-overlay); min-height: 100vh; width: 100%; padding-bottom: 60px; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }

    .logo-container { text-align: center; padding-top: 25px; margin-bottom: 15px; }
    .main-logo { max-width: 100px; height: auto; }

    .header-section, .calendar-section, .form-section, .record-card {
      background: var(--card-bg) !important;
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      padding: 20px;
    }

    /* 倒數計時 */
    .header-section { text-align: center; }
    .countdown-display { font-size: 2.8rem; font-weight: bold; color: var(--text-main); }
    .countdown-display span { font-size: 1.1rem; color: var(--text-light); margin-left: 5px; }

    /* 日曆 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .calendar-header h2 { font-size: 1.1rem; font-weight: 600; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: var(--text-light); margin-bottom: 10px; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-day { min-height: 80px; border: 1px solid rgba(226, 211, 193, 0.2); border-radius: 8px; padding: 5px 2px; cursor: pointer; display: flex; flex-direction: column; }
    .calendar-day-num { font-size: 0.85rem; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .calendar-day.today .calendar-day-num { background: var(--today-color); color: #fff; border-radius: 50%; }
    .calendar-day.selected { border: 2px solid var(--accent-dark); background: rgba(252, 250, 247, 1); }
    .event-bar { font-size: 9px; padding: 2px 4px; border-radius: 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4A443F; border-left: 2px solid rgba(0,0,0,0.15); }

    /* 表單區塊 */
    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .date-input { padding: 8px 12px; border: 1px solid #EAE6DF; border-radius: 10px; font-size: 1rem; color: var(--text-main); outline: none; }
    
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; font-weight: 500; }
    .color-picker { display: flex; gap: 12px; }
    .color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .color-opt.active { border-color: var(--text-main); transform: scale(1.15); }

    /* 快捷按鈕 */
    .quick-btns { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-quick { padding: 6px 12px; background: #fff; border: 1px solid var(--accent-color); border-radius: 20px; color: var(--text-main); font-size: 0.85rem; cursor: pointer; }

    .form-control { width: 100%; padding: 12px 15px; border: 1px solid #EAE6DF; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.3s; }
    .form-control:focus { border-color: var(--accent-dark); box-shadow: 0 0 5px rgba(201, 184, 163, 0.2); }
    textarea.form-control { resize: none; }

    .btn-submit { width: 100%; padding: 15px; background: var(--accent-color); color: white; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
    .btn-submit:active { transform: scale(0.98); background: var(--accent-dark); }
    .btn-cancel { width: 100%; padding: 10px; background: transparent; color: var(--text-light); border: none; cursor: pointer; font-size: 0.9rem; }

    /* 紀錄列表 */
    .records-title { font-size: 1.2rem; margin: 30px 0 15px; color: var(--text-main); text-align: center; letter-spacing: 1px; }
    .record-card { padding: 18px; border-radius: 15px; border-left: 8px solid var(--accent-color); display: flex; justify-content: space-between; align-items: flex-start; }
    .note-text { font-size: 0.85rem; color: var(--text-light); margin-top: 8px; font-style: italic; background: #FDFBF8; padding: 5px 8px; border-radius: 5px; display: inline-block; }
    .record-actions { display: flex; gap: 15px; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 5px; }

    /* 費用總計欄位 */
    .total-summary-row {
      background: #5C544D; color: #FFF; padding: 22px; border-radius: 16px; margin-top: 20px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="page-overlay">
    <div class="container">
      
      <div class="logo-container">
        <img src="logo.png" alt="Logo" class="main-logo" onerror="this.style.display='none'">
      </div>

      <header class="header-section">
        <h1 style="font-size:0.9rem; color:var(--text-light); margin-bottom:8px; font-weight:normal; letter-spacing: 2px;">李龍龍（暫）降臨倒數</h1>
        <div class="countdown-display" id="countdown-timer">0<span>天</span></div>
      </header>

      <section class="calendar-section">
        <div class="calendar-header">
          <button onclick="changeMonth(-1)" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">❮</button>
          <h2 id="calendar-title">2026年 12月</h2>
          <button onclick="changeMonth(1)" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">❯</button>
        </div>
        <div class="calendar-weekdays">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendar-days" class="calendar-days"></div>
      </section>

      <section class="form-section" id="form-area">
        <div class="form-header">
          <span id="form-title" style="font-weight: 600;">新增紀錄</span>
          <input type="date" id="input-date" class="date-input" onchange="highlightSelectedDate()">
        </div>

        <div class="input-group">
          <label>標籤色</label>
          <div class="color-picker" id="color-picker">
            <div class="color-opt active" style="background:var(--color-1)" data-color="var(--color-1)"></div>
            <div class="color-opt" style="background:var(--color-2)" data-color="var(--color-2)"></div>
            <div class="color-opt" style="background:var(--color-3)" data-color="var(--color-3)"></div>
            <div class="color-opt" style="background:var(--color-4)" data-color="var(--color-4)"></div>
            <div class="color-opt" style="background:var(--color-5)" data-color="var(--color-5)"></div>
          </div>
        </div>

        <div class="input-group">
          <div class="quick-btns">
            <button class="btn-quick" onclick="quickFill('產檢', 'var(--color-2)')">＋ 產檢</button>
          </div>
          <input type="text" id="input-content" class="form-control" placeholder="輸入內容">
        </div>

        <div class="input-group">
          <input type="number" id="input-cost" class="form-control" placeholder="花費$">
        </div>

        <div class="input-group">
          <label>今日筆記 (限 30 字)</label>
          <textarea id="input-note" class="form-control" maxlength="30" rows="2" placeholder="寫點什麼呢..."></textarea>
        </div>

        <button id="btn-save" class="btn-submit" onclick="saveRecord()">存入行事曆</button>
        <button id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">取消編輯</button>
      </section>

      <h2 class="records-title">將將將！這裡會統計一切！</h2>
      <div id="records-container"></div>
      <div id="grand-total-section"></div>
    </div>
  </div>

  <script>
    // 1. 預產期更新為 2026/12/12
    const dueDate = new Date('2026-12-12');
    
    let records = JSON.parse(localStorage.getItem('longlong_records')) || [
      { id: 1, date: "2026-04-24", content: "驗孕", cost: 0, note: "這是一切的開始！", color: "var(--color-4)" }
    ];
    
    let currentYear = 2026; 
    let currentMonth = 11; // 顯示 12 月
    let selectedColor = "var(--color-1)"; 
    let editingId = null;

    function init() {
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      startCountdownAnimation();
      renderCalendar();
      renderRecords();
      setupColorPicker();
    }

    // 2. 數字滾動動畫
    function startCountdownAnimation() {
      const diff = Math.ceil((dueDate - new Date()) / (1000 * 60 * 60 * 24));
      const target = diff > 0 ? diff : 0;
      let start = 0;
      const duration = 1500; 
      const step = (timestamp) => {
        if (!startTime) var startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const current = Math.floor(progress * target);
        document.getElementById('countdown-timer').innerHTML = `${current}<span>天</span>`;
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    function setupColorPicker() {
      document.querySelectorAll('.color-opt').forEach(opt => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          selectedColor = opt.getAttribute('data-color');
        });
      });
    }

    // 5. 產檢按鈕快速帶入
    function quickFill(text, color) {
      document.getElementById('input-content').value = text;
      selectedColor = color;
      document.querySelectorAll('.color-opt').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('data-color') === color);
      });
    }

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-days');
      const inputDate = document.getElementById('input-date').value;
      document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth + 1}月`;
      container.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        container.innerHTML += `<div class="calendar-day empty" style="visibility:hidden;"></div>`;
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const div = document.createElement('div');
        div.className = `calendar-day ${dateStr === inputDate ? 'selected' : ''}`;
        
        if(new Date().toDateString() === new Date(currentYear, currentMonth, i).toDateString()) div.classList.add('today');
        div.innerHTML = `<div class="calendar-day-num">${i}</div>`;
        
        records.filter(r => r.date === dateStr).forEach(r => {
          div.innerHTML += `<div class="event-bar" style="background-color:${r.color}">${r.content}</div>`;
        });

        div.onclick = () => {
          document.getElementById('input-date').value = dateStr;
          renderCalendar();
        };
        container.appendChild(div);
      }
    }

    function highlightSelectedDate() {
      const val = new Date(document.getElementById('input-date').value);
      currentYear = val.getFullYear(); currentMonth = val.getMonth(); renderCalendar();
    }

    function saveRecord() {
      const content = document.getElementById('input-content').value.trim();
      const cost = parseInt(document.getElementById('input-cost').value) || 0;
      const note = document.getElementById('input-note').value.trim();
      const date = document.getElementById('input-date').value;

      if (!content) return alert("請輸入內容喔！");

      if (editingId) {
        const index = records.findIndex(r => r.id === editingId);
        records[index] = { ...records[index], date, content, cost, note, color: selectedColor };
        editingId = null;
      } else {
        records.push({ id: Date.now(), date, content, cost, note, color: selectedColor });
      }

      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem('longlong_records', JSON.stringify(records));
      resetForm(); renderRecords(); renderCalendar();
    }

    function editRecord(id) {
      const r = records.find(record => record.id === id);
      if (!r) return;
      editingId = id;
      document.getElementById('input-date').value = r.date;
      document.getElementById('input-content').value = r.content;
      document.getElementById('input-cost').value = r.cost || "";
      document.getElementById('input-note').value = r.note || "";
      selectedColor = r.color;
      document.querySelectorAll('.color-opt').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('data-color') === r.color);
      });
      document.getElementById('form-title').innerText = "編輯模式";
      document.getElementById('btn-save').innerText = "確認修改";
      document.getElementById('btn-cancel').style.display = "block";
      document.getElementById('form-area').scrollIntoView({ behavior: 'smooth' });
      renderCalendar();
    }

    function deleteRecord(id) {
      if (confirm("確定要刪除這筆回憶嗎？")) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('longlong_records', JSON.stringify(records));
        renderRecords(); renderCalendar();
      }
    }

    function resetForm() {
      editingId = null;
      document.getElementById('input-content').value = "";
      document.getElementById('input-cost').value = "";
      document.getElementById('input-note').value = "";
      document.getElementById('form-title').innerText = "新增紀錄";
      document.getElementById('btn-save').innerText = "存入行事曆";
      document.getElementById('btn-cancel').style.display = "none";
    }

    function renderRecords() {
      const container = document.getElementById('records-container');
      const totalSection = document.getElementById('grand-total-section');
      let total = 0; container.innerHTML = '';
      
      if (records.length === 0) { totalSection.innerHTML = ''; return; }

      records.forEach(r => {
        total += r.cost;
        container.innerHTML += `
          <div class="record-card" style="border-left-color:${r.color}">
            <div class="record-info" style="flex:1;">
              <div style="font-size:0.75rem; color:var(--text-light);">${r.date}</div>
              <div style="font-weight:bold; font-size:1.1rem; margin-top:2px;">${r.content}</div>
              ${r.note ? `<div class="note-text">${r.note}</div>` : ''}
              <div style="color:var(--danger-color); font-weight:bold; margin-top:10px;">${r.cost > 0 ? '$'+r.cost.toLocaleString() : '-'}</div>
            </div>
            <div class="record-actions">
              <button class="action-btn" onclick="editRecord(${r.id})">✎</button>
              <button class="action-btn" style="color:var(--danger-color)" onclick="deleteRecord(${r.id})">✕</button>
            </div>
          </div>
        `;
      });

      totalSection.innerHTML = `
        <div class="total-summary-row">
          <span style="font-weight:normal; opacity:0.85; font-size:0.9rem;">費用總計</span>
          <span style="font-size:1.6rem; font-weight:bold;">NT$ ${total.toLocaleString()}</span>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
