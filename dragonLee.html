<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>李龍龍行事曆 V5 - 管理增強版</title>
  <style>
    :root {
      --bg-color: #F8F6F0; 
      --card-bg: #FFFFFF; 
      --text-main: #5C544D; 
      --text-light: #8E8781; 
      --accent-color: #E2D3C1; 
      --accent-dark: #C9B8A3;
      --danger-color: #DDA7A5; 
      --today-color: #D6C2A9;
      --edit-color: #B8C4D9;
      
      --color-1: #E2D3C1; --color-2: #D4E2D9; --color-3: #D6E0E9; --color-4: #E9D7D7; --color-5: #EFE5D3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }

    /* 頂部倒數 */
    .header-section { text-align: center; margin-bottom: 20px; padding: 20px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px rgba(92, 84, 77, 0.05); }
    .countdown-display { font-size: 2.2rem; font-weight: bold; }
    .countdown-display span { font-size: 1rem; color: var(--text-light); }

    /* 日曆區塊 */
    .calendar-section { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(92, 84, 77, 0.05); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: var(--text-light); margin-bottom: 8px; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .calendar-day { min-height: 75px; border: 1px solid #FDFBF8; border-radius: 6px; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; }
    .calendar-day-num { font-size: 0.8rem; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
    .calendar-day.today .calendar-day-num { background: var(--today-color); color: #fff; border-radius: 50%; }
    .calendar-day.selected { border: 1px solid var(--accent-dark); background: #FCFAF7; }
    .event-bar { font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #4A443F; border-left: 2px solid rgba(0,0,0,0.1); }

    /* 表單區塊 */
    .form-section { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(92, 84, 77, 0.05); margin-bottom: 20px; }
    .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
    .date-input { padding: 8px; border: 1px solid #EAE6DF; border-radius: 8px; font-size: 1rem; color: var(--text-main); }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #EAE6DF; border-radius: 8px; outline: none; font-size: 1rem; }
    
    .color-picker { display: flex; gap: 10px; margin-top: 5px; }
    .color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-opt.active { border-color: var(--text-main); transform: scale(1.1); }

    .btn-submit { width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-cancel { width: 100%; padding: 10px; background: transparent; color: var(--text-light); border: none; cursor: pointer; font-size: 0.9rem; }

    /* 歷史明細列表 */
    .records-title { font-size: 1.1rem; margin: 25px 0 10px; color: var(--text-main); border-left: 4px solid var(--accent-color); padding-left: 10px; }
    .record-card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--accent-color); box-shadow: 0 2px 6px rgba(0,0,0,0.03); position: relative; }
    .record-info { flex: 1; }
    .record-actions { display: flex; gap: 12px; margin-left: 15px; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 5px; border-radius: 4px; }
    .edit-btn { color: var(--edit-color); }
    .del-btn { color: var(--danger-color); }

    /* ★ 新增：明細最下方的總計欄位 ★ */
    .total-summary-row {
      background: var(--text-main);
      color: #FFF;
      padding: 18px 20px;
      border-radius: 12px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(92, 84, 77, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-section">
      <h1 style="font-size:0.9rem; color:var(--text-light); margin-bottom:5px;">李龍龍（暫）降臨倒數</h1>
      <div class="countdown-display" id="countdown-timer">-- <span>天</span></div>
    </header>

    <section class="calendar-section">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)" style="border:none; background:none; cursor:pointer;">❮</button>
        <h2 id="calendar-title">2026年 4月</h2>
        <button onclick="changeMonth(1)" style="border:none; background:none; cursor:pointer;">❯</button>
      </div>
      <div class="calendar-weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div id="calendar-days" class="calendar-days"></div>
    </section>

    <section class="form-section" id="form-area">
      <div class="form-header">
        <span id="form-title">新增紀錄</span>
        <input type="date" id="input-date" class="date-input" onchange="highlightSelectedDate()">
      </div>

      <div class="input-group">
        <label>選擇分類色</label>
        <div class="color-picker" id="color-picker">
          <div class="color-opt active" style="background:var(--color-1)" data-color="var(--color-1)"></div>
          <div class="color-opt" style="background:var(--color-2)" data-color="var(--color-2)"></div>
          <div class="color-opt" style="background:var(--color-3)" data-color="var(--color-3)"></div>
          <div class="color-opt" style="background:var(--color-4)" data-color="var(--color-4)"></div>
          <div class="color-opt" style="background:var(--color-5)" data-color="var(--color-5)"></div>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="input-content" class="form-control" placeholder="輸入項目內容 (如：買葉酸)">
      </div>
      
      <div class="input-group">
        <input type="number" id="input-cost" class="form-control" placeholder="金額 (無則留空)">
      </div>

      <button id="btn-save" class="btn-submit" onclick="saveRecord()">存入紀錄</button>
      <button id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">取消編輯</button>
    </section>

    <h2 class="records-title">歷程與花費明細</h2>
    <div id="records-container"></div>
    
    <div id="grand-total-section"></div>
  </div>

  <script>
    const dueDate = new Date('2026-06-12');
    let records = [
      { id: 1, date: "2026-04-24", content: "驗孕", cost: 0, color: "var(--color-4)" },
      { id: 2, date: "2026-04-25", content: "產檢", cost: 250, color: "var(--color-2)" }
    ];
    
    let currentYear = 2026;
    let currentMonth = 3; 
    let selectedColor = "var(--color-1)";
    let editingId = null;

    // 顏色切換
    document.querySelectorAll('.color-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedColor = opt.getAttribute('data-color');
      });
    });

    function init() {
      document.getElementById('input-date').value = "2026-04-25";
      updateCountdown();
      renderCalendar();
      renderRecords();
    }

    function updateCountdown() {
      const diff = Math.ceil((dueDate - new Date()) / (1000 * 60 * 60 * 24));
      document.getElementById('countdown-timer').innerHTML = diff > 0 ? `${diff} <span>天</span>` : `李龍龍降臨！`;
    }

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-days');
      const inputDate = document.getElementById('input-date').value;
      document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth + 1}月`;
      container.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        container.innerHTML += `<div class="calendar-day empty" style="visibility:hidden;"></div>`;
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        const div = document.createElement('div');
        div.className = `calendar-day ${dateStr === inputDate ? 'selected' : ''}`;
        if(new Date().toDateString() === new Date(currentYear, currentMonth, i).toDateString()) div.classList.add('today');

        div.innerHTML = `<div class="calendar-day-num">${i}</div>`;
        records.filter(r => r.date === dateStr).forEach(r => {
          div.innerHTML += `<div class="event-bar" style="background-color:${r.color}">${r.content}</div>`;
        });

        div.onclick = () => {
          document.getElementById('input-date').value = dateStr;
          renderCalendar();
          // 自動捲動到表單區方便編輯
          document.getElementById('form-area').scrollIntoView({ behavior: 'smooth' });
        };
        container.appendChild(div);
      }
    }

    function highlightSelectedDate() {
      const val = new Date(document.getElementById('input-date').value);
      currentYear = val.getFullYear(); currentMonth = val.getMonth();
      renderCalendar();
    }

    // 儲存紀錄 (新增或更新)
    function saveRecord() {
      const content = document.getElementById('input-content').value.trim();
      const cost = parseInt(document.getElementById('input-cost').value) || 0;
      const date = document.getElementById('input-date').value;

      if (!content) return alert("請輸入內容項目");

      if (editingId) {
        // 更新現有紀錄
        const index = records.findIndex(r => r.id === editingId);
        records[index] = { ...records[index], date, content, cost, color: selectedColor };
        editingId = null;
      } else {
        // 新增紀錄
        records.push({ id: Date.now(), date, content, cost, color: selectedColor });
      }

      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      resetForm();
      renderRecords();
      renderCalendar();
    }

    // 編輯紀錄：將資料帶回表單
    function editRecord(id) {
      const r = records.find(record => record.id === id);
      if (!r) return;

      editingId = id;
      document.getElementById('input-date').value = r.date;
      document.getElementById('input-content').value = r.content;
      document.getElementById('input-cost').value = r.cost === 0 ? "" : r.cost;
      
      // 更新顏色選擇器狀態
      selectedColor = r.color;
      document.querySelectorAll('.color-opt').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('data-color') === r.color);
      });

      document.getElementById('form-title').innerText = "編輯紀錄模式";
      document.getElementById('btn-save').innerText = "更新紀錄內容";
      document.getElementById('btn-cancel').style.display = "block";
      document.getElementById('form-area').scrollIntoView({ behavior: 'smooth' });
      renderCalendar(); // 確保日曆選取框同步
    }

    // 刪除紀錄
    function deleteRecord(id) {
      if (confirm("確定要刪除這筆紀錄嗎？")) {
        records = records.filter(r => r.id !== id);
        renderRecords();
        renderCalendar();
      }
    }

    function resetForm() {
      editingId = null;
      document.getElementById('input-content').value = "";
      document.getElementById('input-cost').value = "";
      document.getElementById('form-title').innerText = "新增紀錄";
      document.getElementById('btn-save').innerText = "存入行事曆";
      document.getElementById('btn-cancel').style.display = "none";
    }

    function renderRecords() {
      const container = document.getElementById('records-container');
      const totalSection = document.getElementById('grand-total-section');
      let total = 0;
      container.innerHTML = '';
      
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#AAA;">尚無紀錄</div>';
        totalSection.innerHTML = '';
        return;
      }

      records.forEach(r => {
        total += r.cost;
        container.innerHTML += `
          <div class="record-card" style="border-left-color:${r.color}">
            <div class="record-info">
              <div style="font-size:0.75rem; color:var(--text-light);">${r.date.replace(/-/g, '/')}</div>
              <div style="font-weight:bold; font-size:1rem; margin-top:2px;">${r.content}</div>
              <div style="color:var(--danger-color); font-weight:bold; margin-top:4px;">${r.cost > 0 ? '$'+r.cost.toLocaleString() : '-'}</div>
            </div>
            <div class="record-actions">
              <button class="action-btn edit-btn" onclick="editRecord(${r.id})">✎ 編輯</button>
              <button class="action-btn del-btn" onclick="deleteRecord(${r.id})">✕ 刪除</button>
            </div>
          </div>
        `;
      });

      // ★ 渲染最下方的總計欄位 ★
      totalSection.innerHTML = `
        <div class="total-summary-row">
          <span style="font-weight:normal; opacity:0.9;">累計醫療花費總計</span>
          <span style="font-size:1.6rem; font-weight:bold;">NT$ ${total.toLocaleString()}</span>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
